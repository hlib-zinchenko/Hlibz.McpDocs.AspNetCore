name: Latest MCP SDK

# The package is built against ModelContextProtocol.AspNetCore 2.4.0 but installs into apps on any newer
# version, and its [Authorize] filtering and endpoint discovery mirror that SDK's internals. This runs the
# tests against the newest stable SDK, so a change there shows up here before a user reports it.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-latest-sdk:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json
          dotnet-version: 10.0.x

      # The newest stable release, as the central version the tests run. The library's own range
      # (VersionOverride in its csproj) stays: the tests' direct reference lifts it.
      - name: Use the newest SDK
        run: |
          latest=$(curl -fsS https://api.nuget.org/v3-flatcontainer/modelcontextprotocol.aspnetcore/index.json \
            | jq -r '[.versions[] | select(test("-") | not)] | last')
          sed -i -E "s|(Include=\"ModelContextProtocol.AspNetCore\" Version=\")[^\"]+|\1$latest|" Directory.Packages.props
          grep "ModelContextProtocol.AspNetCore" Directory.Packages.props

      - name: Test
        run: dotnet test --project tests/Hlibz.McpDocs.AspNetCore.Tests --configuration Release
