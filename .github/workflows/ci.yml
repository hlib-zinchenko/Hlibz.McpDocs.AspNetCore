name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token: nothing in CI needs to write to the repository.
permissions:
  contents: read

# One run per PR at a time: pushing again cancels the PR's run still in progress, so repeated
# pushes can't pile up runs. Runs on main are never cancelled.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The library and its tests target net8.0; the sample app targets net10.0.
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      # tests/Visual (Playwright) is not run here: its screenshot baselines are per OS and only
      # the macOS ones are checked in.
      - name: Test
        run: dotnet test tests/Hlibz.McpDocs.AspNetCore.Tests.csproj --no-build --configuration Release

      - name: Pack
        run: dotnet pack src/Hlibz.McpDocs.AspNetCore --no-build --configuration Release --output ./artifacts

      # README and icon in the nuspec, page assets embedded in the assembly. release.yml runs the same checks.
      - name: Check package
        run: bash .github/scripts/check-package.sh ./artifacts
